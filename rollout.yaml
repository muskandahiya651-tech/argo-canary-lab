apiVersion: argoproj.io/v1alpha1
kind: Rollout

metadata:
  name: canary-app
  namespace: canary-demo

spec:

  replicas: 4

  selector:
    matchLabels:
      app: canary-app

  template:

    metadata:
      labels:
        app: canary-app

    spec:

      containers:

        - name: nginx

          image: nginx:1.27

          ports:
            - containerPort: 80

          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html

      volumes:

        - name: html

          configMap:
            name: app-config

  strategy:

    canary:

      steps:

        - setWeight: 25

        - pause:
            duration: 30s

        - setWeight: 50

        - pause:
            duration: 30s

        - setWeight: 75

        - pause:
            duration: 30s